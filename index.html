<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quasi · Portal de Atendimento</title>
<meta name="description" content="Relatório semanal de atendimento ao cliente da Quasi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23CB6387'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Petrona:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<div class="shell">

  <!-- ------------------------------------------------------------ navegação -->
  <aside class="rail" id="rail">
    <div class="rail__brand">
      <span class="wordmark">quasi</span>
      <span class="rail__sub">Portal de Atendimento</span>
    </div>

    <nav class="rail__nav" aria-label="Seções do portal">
      <button class="navitem is-active" data-view="overview" type="button">
        <span class="navitem__dot" aria-hidden="true"></span>
        <span class="navitem__label">Visão da semana</span>
      </button>
      <button class="navitem" data-view="operation" type="button">
        <span class="navitem__dot" aria-hidden="true"></span>
        <span class="navitem__label">Operação</span>
      </button>
      <button class="navitem" data-view="chargebacks" type="button">
        <span class="navitem__dot" aria-hidden="true"></span>
        <span class="navitem__label">Chargebacks</span>
      </button>
      <button class="navitem" data-view="plans" type="button">
        <span class="navitem__dot" aria-hidden="true"></span>
        <span class="navitem__label">Planos de ação</span>
      </button>
      <button class="navitem" data-view="sources" type="button">
        <span class="navitem__dot" aria-hidden="true"></span>
        <span class="navitem__label">De onde vêm os números</span>
      </button>
    </nav>

    <div class="rail__foot">
      <div class="rail__meta" id="rail-meta"></div>
      <p class="rail__fake">Todos os números desta página são fictícios.</p>
    </div>
  </aside>

  <!-- ---------------------------------------------------------------- corpo -->
  <div class="main">

    <header class="topbar">
      <div class="topbar__title">
        <h1 id="view-title">Visão da semana</h1>
        <p id="view-sub"></p>
      </div>

      <div class="topbar__filters">
        <label class="field">
          <span class="field__label">Período</span>
          <select id="filter-period" class="control"></select>
        </label>
        <label class="field">
          <span class="field__label">Motivo do contato</span>
          <select id="filter-reason" class="control"></select>
        </label>
      </div>
    </header>

    <div class="alerts" id="alerts" hidden></div>

    <main class="content" id="conteudo" tabindex="-1">
      <div class="loading" id="loading">
        <span class="loading__pulse" aria-hidden="true"></span>
        Carregando os dados…
      </div>
      <section class="view" id="view-overview" hidden></section>
      <section class="view" id="view-operation" hidden></section>
      <section class="view" id="view-chargebacks" hidden></section>
      <section class="view" id="view-plans" hidden></section>
      <section class="view" id="view-sources" hidden></section>
    </main>

  </div>
</div>

<div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
